name: deploy-conoha

# main に変更が入ったら（自動更新ボットの変更も含む）ConoHa WING の urilabo.com へ
# SSH（ポート8022）経由の rsync で、変わったファイルだけアップロードする。
# 削除はしない（--delete なし）。リポジトリに無いファイル（.htaccess、base/、smaho/ など）は触らない。
#
# 必要な Secrets：
#   SSH_HOST         … www1189.conoha.ne.jp
#   SSH_USER         … ConoHa WING の SSH ユーザー名（c から始まる英数字）
#   SSH_PRIVATE_KEY  … ConoHa で作成した SSH 秘密鍵（.pem の中身をまるごと）
# 任意の Variables：
#   SSH_DIR          … アップロード先（未設定なら public_html/urilabo.com/）
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/update-news.yml"
  workflow_run:
    workflows: ["update-news"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-conoha
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # update-news が失敗したときは動かさない
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: "8022"
      SSH_DIR: ${{ vars.SSH_DIR || 'public_html/urilabo.com/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          # 貼り付け時に改行が崩れても（CRLF・前後の空白・改行が空白に化ける等）鍵の形に組み直す
          python3 - <<'PY'
          import os, re
          k = os.environ["SSH_PRIVATE_KEY"].replace("\r", "").strip()
          m = re.search(r"(-----BEGIN [A-Z ]+-----)(.*?)(-----END [A-Z ]+-----)", k, re.S)
          if not m:
              raise SystemExit("SSH_PRIVATE_KEY の形式が正しくありません（BEGIN/END 行が見つかりません）")
          body = re.sub(r"\s+", "", m.group(2))
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          path = os.path.expanduser("~/.ssh/id_deploy")
          with open(path, "w") as f:
              f.write(m.group(1) + "\n" + "\n".join(lines) + "\n" + m.group(3) + "\n")
          PY
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null && echo "鍵の読み込みOK"
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload to ConoHa (rsync over SSH, changed files only, no delete)
        run: |
          rsync -rltvz --checksum \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='scripts/' \
            --exclude='docs/' \
            --exclude='CNAME' \
            --exclude='.htaccess' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$SSH_DIR"
